# Render Blueprint (https://render.com/docs/blueprint-spec): develop deploys and PR previews.
# Production runs the nginx container (Dockerfile) instead.
# Render applies this file only to services created from it as a Blueprint; a service made in the dashboard ignores
#   envVars, branch and routes here.
services:
  - type: web
    runtime: static
    name: test-jb-main
    branch: develop
    autoDeployTrigger: commit
    buildCommand: bash build.sh
    staticPublishPath: public/
    previews:
      generation: automatic
    envVars:
      # the archive's Render deploy: Archive nav link and 404-page fallback (build.sh), and the routes below
      - key: ARCHIVE_URL
        value: https://test-jb-archive.onrender.com
    # Retired shows moved to the archive site; generated from scripts/archived-shows.txt
    #   (test/test_archive_redirects.py keeps them in sync with it and with ARCHIVE_URL)
    routes:
      - type: redirect
        source: /archive/*
        destination: https://test-jb-archive.onrender.com/
      - type: redirect
        source: /show/ask-noah-show/*
        destination: https://test-jb-archive.onrender.com/show/ask-noah-show/*
      - type: redirect
        source: /show/ask-noah-show
        destination: https://test-jb-archive.onrender.com/show/ask-noah-show/
      - type: redirect
        source: /show/beer-is-tasty/*
        destination: https://test-jb-archive.onrender.com/show/beer-is-tasty/*
